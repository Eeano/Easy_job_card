<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LOGIN TEST</title>
<style>
body{background:#000;color:#fff;font-family:Arial;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
.box{background:#111;border:2px solid #00c853;border-radius:16px;padding:24px;width:90%;max-width:360px;text-align:center}
input{width:100%;padding:12px;margin:8px 0;background:#222;border:1px solid #333;color:#fff;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:14px;background:#00c853;color:#fff;border:none;border-radius:8px;font-weight:800;margin-top:8px;font-size:16px}
</style>
</head>
<body>
<div class="box">
<h2 style="color:#00e676">NEUTRON TEST</h2>
<input id="e" value="admin@neutron.co.ke">
<input id="p" type="password" value="Neutron2025">
<button id="btn">LOGIN - CLICK ME</button>
<p id="msg" style="font-size:12px;margin-top:10px;min-height:20px"></p>
</div>
<script>
document.getElementById('btn').addEventListener('click', function(){
  var email = document.getElementById('e').value.trim();
  var pass = document.getElementById('p').value.trim();
  var msg = document.getElementById('msg');
  msg.style.color = '#ff0';
  msg.textContent = 'Clicked! Checking ' + email;
  var valid = (email === 'admin@neutron.co.ke' && pass === 'Neutron2025') || (email === '0795467171' && pass === '0795467171') || (email === 'admin' && pass === 'admin');
  setTimeout(function(){
    if(valid){
      localStorage.setItem('neutron_auth','logged');
      msg.style.color = '#00e676';
      msg.textContent = 'SUCCESS! Auth=' + localStorage.getItem('neutron_auth') + ' - Now load full V6';
      alert('LOGIN WORKS! Tell me SUCCESS');
    }else{
      msg.style.color = '#ff5252';
      msg.textContent = 'FAIL - Wrong: ' + email + ' / ' + pass;
    }
  },300);
});
window.onload = function(){
  document.getElementById('msg').textContent = 'Page loaded OK - Ready to click';
}
</script>
</body>
</html>
