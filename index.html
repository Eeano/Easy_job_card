<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>NEUTRON V6 ONE FILE</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff}.h{text-align:center;padding:14px;border-bottom:2px solid #00c853;position:sticky;top:0;background:#000}.h h1{font-size:18px}.h h1 span{color:#00e676}.nav{display:flex;gap:6px;padding:8px;background:#111}.nav button{background:#222;color:#aaa;border:1px solid #333;padding:8px 12px;border-radius:20px;font-weight:700;font-size:11px}.nav button.on{background:#00c853;color:#fff}.card{background:#111;margin:8px;border-radius:12px;border:1px solid #222}.fh{background:#0a0a0a;padding:10px;display:flex;justify-content:space-between}.form{padding:12px;background:#f5f5f5;color:#000}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.full{grid-column:1/-1}label{font-size:10px;font-weight:800;color:#555;display:block;margin-bottom:3px}input,select,textarea{width:100%;padding:10px;background:#1a1a1a;color:#fff;border:1px solid #333;border-radius:6px;font-size:12px}textarea{min-height:60px}.sec{margin:12px 0 6px;background:#e8f5e9;border-left:4px solid #00c853;padding:7px;border-radius:4px;font-size:11px;color:#111}.check{display:grid;grid-template-columns:1fr 1fr;gap:6px}.chk{background:#1e1e1e;border:1px solid #333;border-radius:6px;padding:6px;display:flex;justify-content:space-between;font-size:11px;color:#fff}.btn{padding:11px;border-radius:7px;font-weight:800;border:none;width:100%;cursor:pointer;font-size:11px}.bg{background:#00c853;color:#fff}.bd{background:#333;color:#fff}.bo{background:#111;color:#00e676;border:1px solid #00c853}.sig{border:1px solid #333;border-radius:6px;background:#fff;width:100%;height:110px}.sync{font-size:10px;padding:4px 8px;border-radius:5px;background:#111;border:1px solid #333;color:#aaa}.ok{border-color:#00c853;color:#00e676}.jr{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:8px;margin-bottom:6px;display:flex;justify-content:space-between;font-size:11px}</style></head><body>
<div class="h"><h1>NEUTRON<br><span>ENERGY KENYA</span></h1><p style="color:#00e676;font-size:10px">V6 SECURE - ONE FILE - NO FEE</p><div><span id="sync" class="sync">Local</span> <span id="jid" class="sync ok">GEN-...</span> <span id="iid" class="sync">ID</span></div></div>
<div class="nav"><button class="on" id="b1" onclick="tab('new')">New</button><button id="b2" onclick="tab('hist')">History</button><button id="b3" onclick="tab('back')">Backup</button></div>
<div id="t-new" class="card"><div class="fh"><b>Job Card V6</b><span class="sync ok" id="st">DRAFT</span></div><div class="form">
<div class="row"><div><label>Job No - Central</label><input id="jobNo" readonly><input type="hidden" id="internalId"></div><div><label>Date Kenya</label><input type="datetime-local" id="jobDate"></div></div>
<div class="sec"><b>A. Client - Phone Full Flow</b></div>
<div class="row"><div><label>Client Name *</label><input id="clientName"></div><div><label>Phone *</label><input id="clientPhone" placeholder="0768643301"><small id="ph"></small><br><small id="phNorm" style="font-size:8px;color:#666"></small></div></div>
<div class="row"><div class="full"><label>Location *</label><input id="location"></div></div><div class="sec"><b>B. Generator</b></div><div class="row"><div><label>Model *</label><input id="genType"></div><div><label>Serial *</label><input id="serialNo"></div></div>
<div class="sec"><b>C. Work</b></div><div class="row"><div class="full"><textarea id="serviceDesc" placeholder="Work done"></textarea></div></div>
<div class="sec"><b>D. Checklist</b></div><div class="check" id="cl"></div>
<div class="sec"><b>E. Photos</b></div><div class="row"><div><label>Before</label><input type="file" id="phB" accept="image/*"><div id="prB"></div></div><div><label>After</label><input type="file" id="phA" accept="image/*"><div id="prA"></div></div></div>
<div class="sec"><b>F. Signatures</b></div><div class="row"><div><label>Tech</label><input id="techName"><canvas id="sigT" class="sig"></canvas><button class="btn bd" style="padding:4px" onclick="cls('sigT')">Clear</button></div><div><label>Customer</label><input id="cName"><canvas id="sigC" class="sig"></canvas><button class="btn bd" style="padding:4px" onclick="cls('sigC')">Clear</button></div></div>
<div style="display:grid;grid-template-columns:2fr 1fr;gap:6px;margin-top:10px"><button class="btn bg" onclick="saveJ()">💾 Save</button><button class="btn bo" onclick="pdf()">📄 PDF</button></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px"><button class="btn bg" onclick="send()">✅ WhatsApp</button><button class="btn bo" onclick="exp()">⬇️ Backup</button></div>
<div id="ss" style="font-size:10px;color:#00c853;margin-top:6px"></div>
</div></div>
<div id="t-hist" class="card" style="display:none"><div class="fh"><b>History</b><span id="hc" class="sync">0</span></div><div class="form"><input id="sq" placeholder="Search..." oninput="rh()"><div id="jl" style="margin-top:8px"></div></div></div>
<div id="t-back" class="card" style="display:none"><div class="fh"><b>Backup V6</b></div><div class="form"><div style="background:#e8f5e9;padding:10px;border-radius:8px;font-size:11px"><b>V6 FIXES:</b> Central No, Phone cleaned defined, WA accurate, Photo persistent, No hidden fee</div><div id="at" style="background:#1a1a1a;color:#aaa;padding:8px;border-radius:6px;max-height:180px;overflow:auto;font-size:10px;white-space:pre-wrap;margin-top:8px"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px"><button class="btn bo" onclick="exp()">Export</button><label class="btn bd" style="text-align:center">Import<input type="file" id="imp" accept=".json" style="display:none" onchange="im(event)"></label></div></div></div>
<script>
let currentPhotos={b:null,a:null},sigData={t:null,c:null};
function getKenyaDateTime(){let d=new Date();let p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;}
function getKenyaDate(){let d=new Date();let p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;}
function normalizeKenyanPhone(phone){let raw=phone||'';let cleaned=raw.replace(/\D/g,'');let original=cleaned;let type='unknown';if(cleaned.startsWith('254')){cleaned=cleaned.substring(3);type='intl';}else if(cleaned.startsWith('0')){cleaned=cleaned.substring(1);type='local';}let valid=/^(7\d{8}|1\d{8})$/.test(cleaned);return{raw,original,cleaned,valid,normalized:valid?'0'+cleaned:null,intl:valid?'254'+cleaned:null,type,reason:valid?'Valid':'Must be 07/01 or 254'}};async function genJobNo(){let c=localStorage.getItem('ngc');let y=new Date().getFullYear();if(!c)c=0;c=parseInt(c)+1;localStorage.setItem('ngc',c);return `GEN-${y}-${String(c).padStart(5,'0')}`;}
function genInternalId(){return'id_'+Date.now()+'_'+Math.random().toString(36).substr(2,6);}
async function init(){let s=localStorage.getItem('ncj');let internal=localStorage.getItem('ncj_internal');if(!s){s=await genJobNo();internal=genInternalId();localStorage.setItem('ncj',s);localStorage.setItem('ncj_internal',internal);}document.getElementById('jobNo').value=s;document.getElementById('internalId').value=internal;document.getElementById('iid').textContent='ID:'+internal.slice(0,6);document.getElementById('jid').textContent=s;if(!document.getElementById('jobDate').value)document.getElementById('jobDate').value=getKenyaDateTime();ra();rh();}
function log(t,d){let a=JSON.parse(localStorage.getItem('na')||'[]');a.unshift({t:new Date().toISOString(),ty:t,d:d});localStorage.setItem('na',JSON.stringify(a.slice(0,100)));ra();}
function ra(){let a=JSON.parse(localStorage.getItem('na')||'[]');let el=document.getElementById('at');if(el)el.textContent=a.map(e=>`[${e.t.slice(11,19)}] ${e.ty}: ${e.d}`).join('\n');}
const items=["Oil","Coolant","Fuel","Battery","Belts","Filter","Exhaust","Mounting","ATS","Alarms","Cooling","Safety"];
function build(){document.getElementById('cl').innerHTML=items.map((it,i)=>`<div class="chk"><span>${it}</span><select id="ch${i}"><option>PASS</option><option>FAIL</option><option>N/A</option></select></div>`).join('');}build();
function setup(id){let c=document.getElementById(id),x=c.getContext('2d'),dr=false;function ensure(){let r=c.getBoundingClientRect();if(c.width!==r.width*2){c.width=r.width*2;c.height=110*2;x.scale(2,2);}x.lineWidth=2;x.lineCap='round';}ensure();function p(e){let r=c.getBoundingClientRect();let t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}c.addEventListener('mousedown',e=>{dr=true;let q=p(e);x.beginPath();x.moveTo(q.x,q.y);});c.addEventListener('mousemove',e=>{if(!dr)return;let q=p(e);x.lineTo(q.x,q.y);x.stroke();});window.addEventListener('mouseup',()=>{if(dr){dr=false;saveSig(id);}});c.addEventListener('touchstart',e=>{dr=true;let q=p(e);x.beginPath();x.moveTo(q.x,q.y);e.preventDefault();},{passive:false});c.addEventListener('touchmove',e=>{if(!dr)return;let q=p(e);x.lineTo(q.x,q.y);x.stroke();e.preventDefault();},{passive:false});c.addEventListener('touchend',()=>{dr=false;saveSig(id);});}
function saveSig(id){let c=document.getElementById(id);try{if(id==='sigT')sigData.t=c.toDataURL();else sigData.c=c.toDataURL();}catch{}}
setup('sigT');setup('sigC');function cls(id){let c=document.getElementById(id),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);if(id==='sigT')sigData.t=null;else sigData.c=null;}function prev(i,pr,key){document.getElementById(i).addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{if(key==='b')currentPhotos.b=ev.target.result;else currentPhotos.a=ev.target.result;document.getElementById(pr).innerHTML=`<img src="${ev.target.result}" style="width:100%;border-radius:4px;max-height:80px;object-fit:cover">`;};r.readAsDataURL(f);});}prev('phB','prB','b');prev('phA','prA','a');
document.getElementById('clientPhone').addEventListener('input',e=>{let res=normalizeKenyanPhone(e.target.value);let el=document.getElementById('ph');let el2=document.getElementById('phNorm');if(!e.target.value){el.textContent='';el2.textContent='';return;}if(res.valid){el.textContent=`✓ ${res.normalized} / ${res.intl}`;el.style.color='#00c853';el2.textContent=`cleaned='${res.cleaned}' type=${res.type} defined`; }else{el.textContent=`✗ ${res.reason}`;el.style.color='#c00';el2.textContent=`raw='${res.raw}' cleaned='${res.cleaned}'`;}});
function tab(t){['new','hist','back'].forEach(x=>{let el=document.getElementById('t-'+x);if(el)el.style.display=(x===t?'block':'none');});['b1','b2','b3'].forEach((b,i)=>{let tabs=['new','hist','back'];let el=document.getElementById(b);if(el)el.className=(tabs[i]===t?'on':'');});if(t==='hist')rh();}
function col(){let g=id=>document.getElementById(id)?.value||'';let chk={};items.forEach((it,i)=>{let el=document.getElementById('ch'+i);if(el)chk[it]=el.value;});return{internalId:g('internalId'),jobNo:g('jobNo'),jobDate:g('jobDate'),clientName:g('clientName'),clientPhone:g('clientPhone'),location:g('location'),genType:g('genType'),serialNo:g('serialNo'),serviceDesc:g('serviceDesc'),chk,techName:g('techName'),cName:g('cName'),updated:new Date().toISOString(),kenyaDate:getKenyaDate(),sigs:sigData,photos:currentPhotos};}
async function saveJ(){let d=col();if(!d.clientName.trim()){alert('Client Name');return;}let pc=normalizeKenyanPhone(d.clientPhone);if(!pc.valid){alert(pc.reason);return;}if(!d.genType.trim()||!d.serialNo.trim()){alert('Gen+Serial');return;}if(!d.serviceDesc.trim()){alert('Work');return;}let jobs=JSON.parse(localStorage.getItem('nj')||'[]');let idx=jobs.findIndex(j=>j.internalId===d.internalId);let isNew=idx===-1;if(idx>=0)jobs[idx]={...jobs[idx],...d};else{jobs.unshift(d);let nn=await genJobNo();let nid=genInternalId();localStorage.setItem('ncj',nn);localStorage.setItem('ncj_internal',nid);document.getElementById('jobNo').value=nn;document.getElementById('internalId').value=nid;document.getElementById('iid').textContent='ID:'+nid.slice(0,6);document.getElementById('jid').textContent=nn;currentPhotos={b:null,a:null};sigData={t:null,c:null};document.getElementById('prB').innerHTML='';document.getElementById('prA').innerHTML='';}localStorage.setItem('nj',JSON.stringify(jobs));document.getElementById('sync').textContent='● Saved '+getKenyaDateTime();document.getElementById('sync').className='sync ok';let custs=JSON.parse(localStorage.getItem('ncu')||'{}');custs[d.clientPhone]={name:d.clientName,phone:pc.normalized,phoneIntl:pc.intl,loc:d.location,last:d.jobNo,kenyaDate:getKenyaDate()};localStorage.setItem('ncu',JSON.stringify(custs));log('SAVE','Saved '+d.jobNo);rh();alert(isNew?'Saved '+d.jobNo:'Updated '+d.jobNo);}
async function rh(){let jobs=JSON.parse(localStorage.getItem('nj')||'[]');let q=(document.getElementById('sq')?.value||'').toLowerCase();if(q)jobs=jobs.filter(j=>JSON.stringify(j).toLowerCase().includes(q));document.getElementById('hc').textContent=jobs.length;let jl=document.getElementById('jl');jl.innerHTML='';jobs.forEach(j=>{let div=document.createElement('div');div.className='jr';let left=document.createElement('div');let b=document.createElement('b');b.textContent=j.jobNo;left.appendChild(b);left.appendChild(document.createTextNode(' '+(j.clientName||'')));let br=document.createElement('br');left.appendChild(br);let sm=document.createElement('small');sm.textContent=(j.genType||'')+'|'+(j.serialNo||'');left.appendChild(sm);let btn=document.createElement('button');btn.className='btn bo';btn.style.padding='4px 8px';btn.style.width='auto';btn.textContent='Open';btn.onclick=()=>loadJ(j.internalId);div.appendChild(left);div.appendChild(btn);jl.appendChild(div);});}async function loadJ(key){let jobs=JSON.parse(localStorage.getItem('nj')||'[]');let j=jobs.find(x=>x.internalId===key||x.jobNo===key);if(!j)return;['jobNo','internalId','jobDate','clientName','clientPhone','location','genType','serialNo','serviceDesc','techName','cName'].forEach(k=>{let el=document.getElementById(k);if(el&&j[k]!==undefined)el.value=j[k];});if(j.internalId)document.getElementById('iid').textContent='ID:'+j.internalId.slice(0,6);tab('new');log('OPEN','Opened '+j.jobNo);}
async function pdf(){let {jsPDF}=window.jspdf;let doc=new jsPDF({unit:'mm',format:'a4'});let d=col();let y=10;doc.setFontSize(14);doc.text('NEUTRON ENERGY KENYA V6',10,y);y+=6;doc.setFontSize(9);doc.text(`Office 0795467171 | Kenya ${getKenyaDateTime()} | No hidden fee`,10,y);y+=6;doc.setFontSize(11);doc.text(`Job: ${d.jobNo} ID:${d.internalId.slice(0,6)}`,10,y);y+=7;doc.setFontSize(9);function add(t){if(!t)return;let l=doc.splitTextToSize(t,180);if(y+l.length*4.5>280){doc.addPage();y=10;}doc.text(l,10,y);y+=l.length*4.5+2;}let ph=normalizeKenyanPhone(d.clientPhone);add(`Client: ${d.clientName} Phone:${ph.normalized} Intl:${ph.intl} cleaned=${ph.cleaned}`);add(`Gen: ${d.genType} Serial:${d.serialNo}`);add(`Work: ${d.serviceDesc}`);doc.setFontSize(8);doc.text('V6 FIXES: Central, cleaned defined, WA accurate, No fee',10,y);doc.save(d.jobNo+'.pdf');log('PDF','PDF '+d.jobNo);}
function send(){let d=col();let ph=normalizeKenyanPhone(d.clientPhone);if(!ph.valid){alert(ph.reason);return;}let msg=`*NEUTRON V6*%0A*Job:* ${encodeURIComponent(d.jobNo)}%0A*Kenya:* ${encodeURIComponent(getKenyaDate())}%0A*Client:* ${encodeURIComponent(d.clientName)}%0A*Phone:* ${encodeURIComponent(ph.normalized)}%0A*Gen:* ${encodeURIComponent(d.genType)}%0A*Work:* ${encodeURIComponent((d.serviceDesc||'').slice(0,200))}%0A_Status: WA opening NOT prove sent - verify_%0A_No fee_%0A_ID:${encodeURIComponent(d.internalId.slice(0,6))}_`;let office='254795467171';window.open(`https://wa.me/${ph.intl}?text=${msg}`,'_blank');setTimeout(()=>window.open(`https://wa.me/${office}?text=${msg}`,'_blank'),800);document.getElementById('ss').textContent=`WA opened ${getKenyaDateTime()} - NOT confirmed`;log('WA','WA accurate');}
function exp(){let data={jobs:localStorage.getItem('nj'),cust:localStorage.getItem('ncu'),audit:localStorage.getItem('na'),c:localStorage.getItem('ngc'),ncj:localStorage.getItem('ncj'),ncj_internal:localStorage.getItem('ncj_internal'),v:'V6'};let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let u=URL.createObjectURL(b);let a=document.createElement('a');a.href=u;a.download=`neutron-v6-${getKenyaDate()}.json`;a.click();URL.revokeObjectURL(u);log('BACKUP','Export V6');}
function im(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{try{let d=JSON.parse(ev.target.result);if(!confirm('Import merge?'))return;if(d.jobs){let ex=JSON.parse(localStorage.getItem('nj')||'[]');let inc=JSON.parse(d.jobs);let m=new Map();ex.forEach(j=>m.set(j.internalId||j.jobNo,j));inc.forEach(j=>{let k=j.internalId||j.jobNo;if(!m.has(k))m.set(k,j);});localStorage.setItem('nj',JSON.stringify(Array.from(m.values())));}if(d.cust)localStorage.setItem('ncu',d.cust);if(d.c)localStorage.setItem('ngc',d.c);if(d.ncj)localStorage.setItem('ncj',d.ncj);if(d.ncj_internal)localStorage.setItem('ncj_internal',d.ncj_internal);alert('Imported');location.reload();}catch(err){alert('Invalid:'+err.message);}};r.readAsText(f);}
init();
</script></body></html>
